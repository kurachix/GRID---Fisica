<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkGlow" cx="640" cy="360" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <pattern id="pixelGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="rgba(0,0,0,0.4)"/>
    </pattern>
  </defs>

  <!-- Fundo Totalmente Escuro (Blackout) -->
  <rect width="1280" height="720" fill="#000000"/>

  <!-- Brilho Azul de Faísca Elétrica -->
  <circle cx="640" cy="360" r="400" fill="url(#sparkGlow)"/>

  <!-- Tela de Monitor Principal Apagada -->
  <rect x="240" y="80" width="800" height="400" fill="#030303" stroke="#00e5ff" stroke-width="2" opacity="0.3"/>

  <!-- Faíscas Azuis e Raios do Transformador Derretendo -->
  <path d="M 640 360 L 590 280 L 610 240 L 550 180" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 640 360 L 700 420 L 730 380 L 800 460" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 640 360 L 580 430 L 540 450" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Círculos de Brilho de Faísca -->
  <circle cx="640" cy="360" r="15" fill="#ffffff"/>
  <circle cx="550" cy="180" r="8" fill="#00e5ff"/>
  <circle cx="800" cy="460" r="10" fill="#38bdf8"/>

  <!-- Fumaça Subindo do Painel -->
  <ellipse cx="640" cy="370" rx="90" ry="25" fill="rgba(255,255,255,0.08)"/>
  <ellipse cx="580" cy="220" rx="50" ry="15" fill="rgba(255,255,255,0.06)"/>

  <!-- Robô Volta Caído e Desligado no Chão -->
  <g transform="translate(640, 580)">
    <ellipse cx="0" cy="0" rx="35" ry="35" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Tela com SYSTEM SLEEP / FAILURE -->
    <rect x="-20" y="-10" width="40" height="20" fill="#0c0a0f" stroke="#ff3344" stroke-width="2"/>
    <text x="0" y="3" fill="#ff3344" font-family="'VT323', monospace" font-size="10" text-anchor="middle">OFFLINE</text>
    <!-- Olhos Apagados -->
    <circle cx="-10" cy="-20" r="5" fill="#334155"/>
    <circle cx="10" cy="-20" r="5" fill="#334155"/>
  </g>

  <!-- Tarja de Alerta Crítico Técnico -->
  <rect x="340" y="40" width="600" height="60" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="3"/>
  <text x="640" y="80" fill="#ef4444" font-family="'Press Start 2P', monospace" font-size="20" text-anchor="middle">APAGÃO SISTÊMICO DETECTADO</text>

  <!-- CRT Overlay -->
  <rect width="1280" height="720" fill="url(#pixelGrid)"/>
</svg>
