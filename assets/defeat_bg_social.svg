<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="redAlarm" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff0022" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050002" stop-opacity="0.95"/>
    </radialGradient>
    <pattern id="pixelGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="rgba(0,0,0,0.35)"/>
    </pattern>
  </defs>

  <!-- Fundo Vermelho de Alerta de Revolta -->
  <rect width="1280" height="720" fill="url(#redAlarm)"/>

  <!-- Multidão Protestando Fora da Janela (Silhuetas com Tochas de Fogo) -->
  <g class="mob">
    <!-- Fogo / Tochas -->
    <circle cx="200" cy="380" r="25" fill="#f97316" opacity="0.8"/>
    <circle cx="340" cy="350" r="30" fill="#ef4444" opacity="0.9"/>
    <circle cx="500" cy="390" r="20" fill="#facc15" opacity="0.8"/>
    <circle cx="680" cy="360" r="35" fill="#ef4444" opacity="0.85"/>
    <circle cx="850" cy="370" r="28" fill="#f97316" opacity="0.8"/>
    <circle cx="1050" cy="340" r="32" fill="#ef4444" opacity="0.9"/>

    <!-- Silhuetas de Pessoas -->
    <path d="M 0 450 Q 200 420 400 460 Q 600 410 800 450 Q 1000 420 1280 460 L 1280 720 L 0 720 Z" fill="#030204"/>
  </g>

  <!-- Vidro Trincado / Despedaçado da Sala de Controle -->
  <path d="M 100 0 L 350 400 L 120 720" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="4"/>
  <path d="M 350 400 L 800 200 L 1100 500" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="5"/>
  <path d="M 800 200 L 1280 150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
  <path d="M 350 400 L 500 720" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="4"/>
  <path d="M 650 0 L 800 200" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>

  <!-- Alerta de Emergência Flutuante -->
  <rect x="340" y="80" width="600" height="70" fill="rgba(239, 68, 68, 0.9)" stroke="#ffffff" stroke-width="4"/>
  <text x="640" y="125" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="22" text-anchor="middle">REVOLTA POPULAR DETECTADA</text>

  <!-- CRT Overlay -->
  <rect width="1280" height="720" fill="url(#pixelGrid)"/>
</svg>
